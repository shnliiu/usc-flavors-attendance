<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#C4282D"><title>USC Flavors Member Pass</title><link rel="manifest" href="../manifest.json"><link rel="icon" href="../assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>
:root{--r:#C4282D;--c:#FFF3DF;--i:#2A1410;--p:#FFFDF8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"DM Sans",sans-serif;color:var(--i)}body{min-height:100dvh;display:grid;place-items:center;padding:24px 15px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(160deg,#8fc9f2 0,#dff2ff 34%,#fff 35%,var(--c) 100%)}.card{width:min(92vw,430px);background:var(--p);border:2px solid #ead9bf;border-radius:28px;box-shadow:0 26px 70px rgba(62,40,25,.19);padding:25px 22px 20px}.top{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--r);border-bottom:2px dashed #d7c6ae;padding-bottom:17px}.top img{width:48px}.word{font:29px "Bowlby One"}.k{text-align:center;margin:17px 0 3px;font:600 12px "IBM Plex Mono";letter-spacing:1px}.name{text-align:center;font:29px "Bowlby One";color:var(--r);line-height:1.15;margin:0 0 18px}.qr{background:white;border:3px solid var(--i);border-radius:20px;padding:15px;width:max-content;max-width:100%;margin:auto;box-shadow:0 7px 0 #ead9bf}.qr img,.qr canvas{display:block!important;width:min(62vw,270px)!important;height:min(62vw,270px)!important}.receipt{margin-top:22px;border-top:2px dashed #d7c6ae;padding-top:14px;font:600 12px "IBM Plex Mono";line-height:1.8}.line{display:flex;gap:8px}.dots{flex:1;border-bottom:2px dotted #6b5148;transform:translateY(-5px)}.foot{text-align:center;margin-top:14px;font-size:11px;color:#69534b;line-height:1.45}.nf{text-align:center;padding:35px 8px}.nf h1{font:32px "Bowlby One";color:var(--r);margin:8px 0}.nf p{color:#684b43}
</style></head><body><main class="card"><div class="top"><img src="../assets/logo.svg" alt=""><div class="word">FLAVORS</div></div><div id="content"><div class="k">USC MEMBER PASS</div><div class="name" id="name">Loading…</div><div class="qr" id="qr"></div><div class="receipt"><div class="line"><span>1x FLAVORS MEMBER</span><span class="dots"></span><span>VERIFIED</span></div><div class="line"><span>GOOD COMPANY</span><span class="dots"></span><span>INCLUDED</span></div><div class="line"><span>COMMUNITY</span><span class="dots"></span><span>ALWAYS</span></div></div><div class="foot">Add this page to your phone’s Home Screen for quick check-in access.<br>iPhone: Share → Add to Home Screen · Android: Menu → Add to Home screen</div></div></main><script>
const API_URL='https://script.google.com/macros/s/AKfycby70v3KBBasn9rwHOqa59-OHEKDQy2d9r6jO7rc1kq4F3Tm3Ahn-5GCzPbo-1hfOdyu/exec',code=new URLSearchParams(location.search).get('id')?.trim().toUpperCase()||'';async function load(){if(!code)return fail();try{if(API_URL.startsWith('PASTE_'))throw new Error('Pass system is not connected yet.');const r=await fetch(API_URL+'?action=member&id='+encodeURIComponent(code)),d=await r.json();if(!d.found)return fail();document.getElementById('name').textContent=d.firstName+' '+d.lastName;document.title=d.firstName+' '+d.lastName+' — Flavors Pass';new QRCode(document.getElementById('qr'),{text:code,width:300,height:300,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H})}catch(e){fail(e.message)}}function fail(msg='Card not found. Check the link and try again.'){document.getElementById('content').innerHTML='<div class="nf"><h1>CARD NOT FOUND</h1><p>'+msg+'</p></div>'}load();
</script></body></html>
