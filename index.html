<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#C4282D">
<title>USC Flavors Check-In</title><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode" defer></script>
<style>
:root{--r:#C4282D;--c:#FFF3DF;--w:#FFFDF8;--i:#2A1410;--g:#2E7D4F;--line:#E6D1B6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"DM Sans",sans-serif;color:var(--i)}body{min-height:100dvh;background:linear-gradient(180deg,#f2a36f 0,#f9d7ba 26%,var(--c) 55%)}.app{max-width:760px;margin:auto;min-height:100dvh;background:rgba(255,253,248,.86);box-shadow:0 0 0 1px rgba(0,0,0,.05)}header{position:sticky;top:0;z-index:8;background:var(--r);color:white;padding:max(12px,env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px}header img{width:44px;height:44px;filter:brightness(0) invert(1)}.brand{font:23px "Bowlby One"}.sub{font:11px "IBM Plex Mono"}.status{margin-left:auto;text-align:right}.status strong{display:block;font-size:18px}.status span{font:10px "IBM Plex Mono"}main{padding:15px 14px calc(90px + env(safe-area-inset-bottom))}.card{background:var(--w);border:1px solid var(--line);border-radius:20px;padding:13px;box-shadow:0 18px 45px rgba(88,44,25,.14)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 2px 12px}.date{font:600 12px "IBM Plex Mono"}.start,.manual button,.retry{border:0;background:var(--i);color:white;border-radius:14px;padding:12px 15px;font-weight:800;min-height:44px}.camera{position:relative}.scan-frame{pointer-events:none;position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(68vw,310px);aspect-ratio:1;border:3px solid white;border-radius:28px;box-shadow:0 0 0 999px rgba(42,20,16,.16)}#reader{min-height:55vh;border-radius:16px;overflow:hidden;background:#1e1715}#reader video{object-fit:cover!important}.hint{text-align:center;padding:11px 3px 2px;font:12px "IBM Plex Mono";color:#6b5147}.manual{display:flex;gap:8px;margin-top:11px}.manual input{flex:1;min-width:0;border:1px solid #cdb79d;border-radius:14px;padding:14px;background:white;font:600 16px "IBM Plex Mono";text-transform:uppercase}.manual button{background:var(--r)}.offline{display:none;background:#fff0c8;border:1px solid #e2c36e;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:700}.toast{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-45%) scale(.96);width:min(88vw,390px);background:var(--w);border:3px solid var(--i);border-radius:24px;padding:24px;text-align:center;box-shadow:0 24px 70px rgba(42,20,16,.3);opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast .name{font:25px "Bowlby One";color:var(--r)}.toast .msg{margin-top:8px;font-size:17px;font-weight:800}.pin{position:fixed;inset:0;z-index:50;background:var(--r);display:grid;place-items:center;padding:24px}.pin-card{width:min(92vw,400px);background:var(--c);border-radius:28px;padding:28px 22px;text-align:center}.pin-card img{width:78px}.pin-card h1{font:30px "Bowlby One";color:var(--r);margin:8px 0}.pin-card input{width:100%;font:700 24px "IBM Plex Mono";letter-spacing:7px;text-align:center;padding:13px;border:2px solid #d7c1a4;border-radius:14px}.pin-card button{width:100%;margin-top:10px;border:0;border-radius:14px;background:var(--i);color:white;padding:15px;font-weight:800}.err{color:#9f2024;font-weight:700;font-size:13px;min-height:20px;margin-top:8px}.retry{display:none;margin:12px auto 0}
</style></head><body>
<div class="pin" id="pin"><div class="pin-card"><img src="assets/logo.svg" alt="Flavors logo"><h1>FLAVORS</h1><p>President check-in scanner</p><input id="pinInput" inputmode="numeric" placeholder="PIN"><button id="pinBtn">OPEN SCANNER</button><div class="err" id="pinErr"></div></div></div>
<div class="app"><header><img src="assets/logo.svg" alt=""><div><div class="brand">FLAVORS</div><div class="sub">CHECK-IN RECEIPT</div></div><div class="status"><strong id="count">0 / 0</strong><span id="meeting">NO MEETING OPEN</span></div></header><main>
<div class="offline" id="offline">You’re offline. Reconnect before scanning.</div><section class="card"><div class="top"><div class="date" id="date">MEETING: NOT STARTED</div><button class="start" id="start">Start meeting</button></div><div class="camera"><div id="reader"></div><div class="scan-frame"></div></div><button class="retry" id="retry">Enable camera</button><div class="hint">Hold a member QR code inside the square.</div><div class="manual"><input id="manual" maxlength="8" placeholder="TYPE CODE"><button id="manualBtn">CHECK IN</button></div></section></main></div>
<div class="toast" id="toast"><div class="name" id="toastName"></div><div class="msg" id="toastMsg"></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycby70v3KBBasn9rwHOqa59-OHEKDQy2d9r6jO7rc1kq4F3Tm3Ahn-5GCzPbo-1hfOdyu/exec';
const PUNS=["You're tomato-ly in!","Lettuce welcome you!","Thyme to party, you're checked in!","Souper star!","Nacho average member, you're in!","Olive you, you're checked in!","You're the apple of our eye!","Bread-y for the meeting!","Egg-cellent!","Guac and roll, you're in!","Pizza the action!","You're on a roll!","You make miso happy!","Wok this way — you're in!","Peas to see you!","Taco 'bout perfect timing!","You're one in a melon!","Berry glad you're here!","Pho real, you're checked in!"];
const $=x=>document.getElementById(x);let pin=sessionStorage.getItem('flavorsScannerPin')||'',qr,busy=false,last='',lastAt=0,timer;
async function api(body){if(API_URL.startsWith('PASTE_'))throw new Error('API URL has not been configured yet.');const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const d=await r.json();if(!d.ok&&d.error)throw new Error(d.error);return d}
function render(s){$('count').textContent=`${s.checkedIn||0} / ${s.total||0}`;$('meeting').textContent=s.open?`${s.date} OPEN`:'NO MEETING OPEN';$('date').textContent=s.open?`MEETING: ${s.date}`:'MEETING: NOT STARTED';$('start').style.display=s.open?'none':'block'}
function toast(name,msg,type=''){clearTimeout(timer);$('toastName').textContent=name;$('toastMsg').textContent=msg;$('toast').className='toast show '+type;timer=setTimeout(()=>$('toast').className='toast',2100)}
async function unlock(){const p=$('pinInput').value.trim()||pin;$('pinErr').textContent='';try{await api({action:'verifyPin',pin:p});pin=p;sessionStorage.setItem('flavorsScannerPin',pin);$('pin').style.display='none';render(await api({action:'status',pin}));startCamera()}catch(e){$('pinErr').textContent=e.message==='Incorrect PIN'?'That PIN does not match.':e.message}}
$('pinBtn').onclick=unlock;$('pinInput').onkeydown=e=>{if(e.key==='Enter')unlock()};$('start').onclick=async()=>{try{render(await api({action:'startMeeting',pin}));toast('MEETING OPEN','Ready to scan!')}catch(e){toast('CAN’T START',e.message,'error')}};
async function handle(raw){const code=String(raw||'').trim().toUpperCase();if(!code||busy)return;const now=Date.now();if(code===last&&now-lastAt<3500)return;last=code;lastAt=now;busy=true;try{if(!navigator.onLine)throw new Error('You’re offline. Reconnect and try again.');const r=await api({action:'scan',pin,code});if(r.status)render(r.status);if(r.type==='success'){beep();navigator.vibrate?.(70);toast(r.firstName+' '+r.lastName,PUNS[Math.floor(Math.random()*PUNS.length)])}else if(r.type==='already')toast(r.firstName+' '+r.lastName,'Already checked in — you’re all set!');else toast('NOT FOUND',r.message||'Code not recognized.','error')}catch(e){toast('TRY AGAIN',e.message,'error')}finally{setTimeout(()=>busy=false,450)}}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=740;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.1)}catch{}}
async function startCamera(){if(!window.Html5Qrcode){setTimeout(startCamera,250);return}try{qr=new Html5Qrcode('reader');const cams=await Html5Qrcode.getCameras(),cam=cams.find(x=>/back|rear|environment/i.test(x.label))||cams[cams.length-1];await qr.start(cam.id,{fps:18,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*.68);return{width:s,height:s}},aspectRatio:1},x=>handle(x),()=>{});$('retry').style.display='none'}catch(e){$('retry').style.display='block';toast('CAMERA NEEDED','Tap Enable camera and allow camera access.','error')}}
$('retry').onclick=startCamera;$('manualBtn').onclick=()=>{handle($('manual').value);$('manual').value=''};$('manual').onkeydown=e=>{if(e.key==='Enter')$('manualBtn').click()};function net(){$('offline').style.display=navigator.onLine?'none':'block'}addEventListener('online',net);addEventListener('offline',net);net();if(pin){unlock()}
</script></body></html>
